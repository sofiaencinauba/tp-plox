AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'spec/spec_helper.rb'

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Metrics/MethodLength:
  Max: 35

Metrics/AbcSize:
  Enabled: false

Naming/MethodParameterName:
  MinNameLength: 1